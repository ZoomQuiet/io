# ZoomQuiet.io Hugo 配置
# 基于 Issue #148 决策:
# - PaperMod 默认首页
# - Giscus 评论 (URL mapping)
# - PaperMod 内置搜索
# - Hugo 内置 RSS
# - 不使用多语言
# - URL 完全保持不变 (disablePathToLower = true)

baseURL = "https://zoomquiet.io/"
languageCode = "zh-cn"
title = "ZoomQuiet.io"
theme = "PaperMod"
contentDir = "content"
disablePathToLower = true
hasCJKLanguage = true
enableRobotsTXT = true
timeZone = "Asia/Shanghai"

[pagination]
  pagerSize = 4
  path = "page"

[frontmatter]
date = [":filename", ":default"]

[taxonomies]
  tag = "tags"  # 仅启用 Tags，去掉默认 categories

[markup.goldmark.renderer]
unsafe = true  # 保留旧 MkDocs 内容中的 Raw HTML

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "ZoomQuiet.io"
  description = "大妈的主页"
  author = "ZoomQuiet"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = true   # 每篇文章页 Inject Giscus
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  mainSections = ["weekly", "pythonic", "murmur", "oldtouch", "imho"]  # Hugo .Type 全小写

  [params.label]
    text = "ZoomQuiet.io"

  [params.homeInfoParams]
    Title = "ZoomQuiet.io"
    Content = """
> 无数次迁移后的私人官网

**大妈的私人网站**
- 最早注册 zoomquiet.org，PHP BBS 系统发布
- 后经 pyblosoxm (t2t)、各种 markdoc wiki、Google/GitHub Pages
- 最终选择 zoomquiet.io 作为私人官网
- 曾是完全图片为主的关系图谱，无法被 Google AdSense 收录

**重新汇集私人互联网记忆**
- 用 mdBook / Hugo 重构发布最轻量级网站
- 将所有以往文章汇聚于此
- 关系图谱首页 → [mm.zoomquiet.io](https://mm.zoomquiet.io)
"""

  [params.giscus]
    repo = "ZoomQuiet/comment"
    repoId = "MDEwOlJlcG9zaXRvcnkzNzg1ODM2MDQ="
    category = "Announcements"
    categoryId = "MDE4OkRpc2N1c3Npb25DYXRlZ29yeTMzMDQxMDg2"
    mapping = "url"
    lang = "zh-CN"
    theme = "preferred_color_scheme"

  [params.assets]
    disableFingerprinting = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

