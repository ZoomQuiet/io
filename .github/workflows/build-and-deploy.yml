name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'themes/**'      # 主题源码变更可重新手动触发
      - 'public/**'      # 构建产物不入库，避免触发循环
  workflow_dispatch:     # 保留手动触发能力

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.0'   # PaperMod 要求 >= 0.146
          extended: true

      - name: Build site (Hugo -> public/)
        run: hugo --gc --minify

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing GitHub secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing GitHub variable CLOUDFLARE_ACCOUNT_ID}"
          echo "credentials OK"

      - name: Deploy Hugo site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=io --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
